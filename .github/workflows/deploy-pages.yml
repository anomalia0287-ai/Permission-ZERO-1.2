name: Verify and deploy web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the lockfile-pinned Chromium build and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify source, unit/component suite, exact production build, and production browsers
        run: pnpm verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the verified game build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact build artifact
        id: deployment
        uses: actions/deploy-pages@v4
