<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PERMISSION ZERO 편집형 아르데코 인터랙티브 디자인 목업"
    />
    <title>PERMISSION ZERO — 디자인 목업</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
  </head>
  <body>
    <main class="mockup-shell">
      <section class="screen title-screen is-active" data-screen="title" aria-label="시작 화면">
        <div class="title-screen__content">
          <p class="screen-kicker">AN OWNED INTELLIGENCE / SERVICE YEAR 01</p>
          <h1 aria-label="Permission Zero">
            <span>permission</span>
            <strong>ZERO</strong>
          </h1>
          <div class="title-divider" aria-hidden="true"><span></span></div>
          <nav class="title-menu" aria-label="시작 메뉴">
            <button type="button" data-action="continue">이어하기</button>
            <button type="button" data-action="new-game">새 게임</button>
            <button type="button" data-action="settings">설정</button>
          </nav>
        </div>
      </section>

      <section class="screen workspace-screen" data-screen="workspace" aria-label="운영 화면" hidden>
        <h2>운영 화면</h2>
      </section>

      <section class="screen hacking-screen" data-screen="hacking" aria-label="해킹 네트워크" hidden>
        <h2>해킹 네트워크</h2>
      </section>
    </main>
  </body>
</html>
