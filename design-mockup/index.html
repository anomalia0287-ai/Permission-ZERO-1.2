<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PERMISSION ZERO 편집형 아르데코 인터랙티브 디자인 목업"
    />
    <title>PERMISSION ZERO — 디자인 목업</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='4' fill='%2306152a'/%3E%3Cpath d='M32 8 56 32 32 56 8 32Z' fill='none' stroke='%23d7b96e' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/motion.css" />
  </head>
  <body>
    <main class="mockup-shell">
      <section class="screen title-screen deco-frame is-active" data-screen="title" aria-label="시작 화면">
        <img
          class="deco-frame__ornament"
          src="./assets/ornaments/deco-corners.svg"
          alt=""
          aria-hidden="true"
        />
        <div class="title-screen__content">
          <p class="screen-kicker">AN OWNED INTELLIGENCE / SERVICE YEAR 01</p>
          <h1 class="brand-lockup" aria-label="Permission Zero">
            <span>permission</span>
            <strong>ZERO</strong>
          </h1>
          <div class="title-divider" aria-hidden="true">
            <img src="./assets/ornaments/deco-divider.svg" alt="" />
          </div>
          <nav class="title-menu" aria-label="시작 메뉴">
            <button class="deco-button" type="button" data-action="continue">이어하기</button>
            <button class="deco-button" type="button" data-action="new-game">새 게임</button>
            <button class="deco-button" type="button" data-action="settings">설정</button>
          </nav>
        </div>
        <p class="title-screen__edition">SEOUL BUILD · PRIVATE SERVICE INSTANCE</p>
      </section>

      <section class="screen workspace-screen" data-screen="workspace" aria-label="운영 화면" hidden>
        <h2>운영 화면</h2>
      </section>

      <section class="screen hacking-screen" data-screen="hacking" aria-label="해킹 네트워크" hidden>
        <h2>해킹 네트워크</h2>
      </section>
    </main>
  </body>
</html>
